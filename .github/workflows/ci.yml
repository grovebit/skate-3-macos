name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      SCCACHE_GHA_ENABLED: "true"
      RUSTC_WRAPPER: sccache
    concurrency:
      group: tests-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      # The Rust version of rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          cache-on-failure: true
      - uses: mozilla-actions/sccache-action@v0.0.11
      # The same uv, Python and setup requirements as play.sh.
      - name: Install setup and research requirements
        run: |
          python=$(tools/pinned_tool.sh python)
          uv=$(tools/pinned_tool.sh uv)
          "$uv" pip install --python "$python" -r tools/requirements-research.txt
          dirname "$python" >> "$GITHUB_PATH"
      # Setup builds the sound decoder from source on every Mac.
      - name: Build the pinned vgmstream
        run: tools/pinned_tool.sh vgmstream
      # tools/ uses namespace packages, which unittest discovery skips.
      - name: Test Python tools
        run: python -m unittest -v $(git ls-files 'tools/test_*.py' 'tools/asset_pipeline/test_*.py' 'tools/audio/test_*.py' | sed 's/\.py$//; s#/#.#g')
      - name: Test the Mixamo converter
        working-directory: tools/mixamo_to_skate
        run: python -m unittest -v test_converter test_library
      - name: Test multiplayer launcher
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      # This also compiles every retail shader with the system Metal compiler.
      - name: Test workspace
        run: cargo test --workspace --locked --no-fail-fast

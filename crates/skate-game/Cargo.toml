[package]
name = "skate-game"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "skate3rust"
path = "src/main.rs"

[features]
default = ["dev-dynamic"]
dev-dynamic = ["bevy/dynamic_linking"]

[dependencies]
bevy = { workspace = true, features = ["jpeg", "trace", "debug", "bevy_audio", "wav"] }
skate-core.workspace = true
skate-data.workspace = true
half = "=2.7.1"
rodio = { version = "=0.20.1", default-features = false }
serde_json.workspace = true
serde.workspace = true
    skate-net = { path = "../skate-net" }
blake3 = "=1.8.7"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
skate-mods = { path = "../skate-mods" }
skate-dynamics = { path = "../skate-dynamics" }
gltf = { version = "=1.4.1", default-features = true }
# Controller input through Apple's GameController framework (input/platform/macos.rs).
objc2 = "=0.6.4"
objc2-game-controller = { version = "=0.3.2", default-features = false, features = [
    "std",
    "GCController",
    "GCControllerAxisInput",
    "GCControllerButtonInput",
    "GCControllerDirectionPad",
    "GCControllerElement",
    "GCExtendedGamepad",
    "GCPhysicalInputProfile",
] }

[dev-dependencies]
# The Metal compile check in retail_shader_tests uses naga's Metal writer plus
# the system compiler (wgpu-hal's own Metal bindings, already in the lockfile).
naga = { version = "=27.0.3", features = ["wgsl-in", "msl-out"] }
naga_oil = { version = "=0.20.0", default-features = false }
metal = "=0.32.0"
